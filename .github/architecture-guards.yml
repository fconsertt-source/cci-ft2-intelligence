# .github/workflows/architecture-guards.yml (محدّث)
name: Architecture Guards

on: [push, pull_request]

jobs:
  guard-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🛡️ Guard 1 - Core Entity Imports
        run: python scripts/check_no_core_entity_imports.py

      - name: 🛡️ Guard 2 - DI Container Usage
        run: python scripts/check_di_container_usage.py

      - name: 🛡️ Guard 3 - src/ Root Structure
        run: python scripts/check_src_root_clean.py

      - name: 🔍 Smoke Test - Architectural Contract
        run: python -m src.presentation.cli.architectural_smoke_test

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

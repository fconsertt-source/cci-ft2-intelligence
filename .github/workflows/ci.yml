name: CI
on:
  push:
    branches: ["main", "master", "feature/*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lite:
    name: Lite tests (no heavy deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Prepare lite requirements
        run: |
          grep -Ev 'reportlab|freezegun|pdfminer|pillow|python-bidi|arabic-reshaper|^-r' \
            requirements-dev.txt > lite-reqs.txt
          grep -Ev 'reportlab|pdfminer|pillow|python-bidi|arabic-reshaper|matplotlib' \
            requirements.txt >> lite-reqs.txt

      - name: Install dependencies (lite)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r lite-reqs.txt

      - name: Run tests (lite)
        run: |
          pytest -q \
            --ignore=tests/golden \
            --ignore=tests/performance \
            --ignore=tests/integration/test_visual_reports_generation.py \
            --ignore=tests/unit/test_chart_builder.py \
            --ignore=tests/unit/test_new_pdf_engine.py \
            --ignore=tests/unit/test_header_builder.py \
            --ignore=tests/unit/test_table_builder.py \
            --ignore=tests/unit/test_unified_pdf_generator_wrapper.py

  full:
    name: Full tests (all dependencies)
    runs-on: ubuntu-latest
    needs: lite
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies (full)
        run: |
          python3 -m pip install --upgrade pip
          # تحديث الحزم الضعيفة أولاً
          python3 -m pip install --upgrade sortedcontainers urllib3 requests
          python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (full)
        run: |
          pytest -q

      - name: Check pip consistency
        run: |
          pip check

      # ✅ استخدام GitHub Action الرسمي مع إمكانية استبعاد الثغرات المعروفة
      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          # استبعاد الثغرات التي تم إصلاحها في requirements.txt
          # قم بإزالة التعليق إذا كنت تريد استبعاد ثغرات مؤقتاً
          # ignore-vulns: |
          #   CVE-2024-37891
          #   CVE-2024-47081
          summary: true
          format: json
          output: vulns.json
        # السماح بالفشل مؤقتاً حتى يتم تحديث جميع الحزم
        continue-on-error: true

      # ✅ خطوة إضافية: تحديث تلقائي للحزم الضعيفة
      - name: Auto-fix vulnerabilities
        if: failure()
        run: |
          pip install pip-audit
          # محاولة إصلاح الثغرات تلقائياً
          pip-audit --fix || echo "Some vulnerabilities could not be auto-fixed"
          # حفظ النتائج
          pip-audit --format=json --output=vulns-fixed.json || true
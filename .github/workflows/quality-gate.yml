name: Quality Gate

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-tools.txt

      - name: Verify sensitive files integrity
        run: python scripts/verify_sensitive_hashes.py

      - name: Regression tests
        run: pytest tests/regression/test_scientific_regression.py -v

      - name: Architecture tests
        run: pytest tests/architecture/ -v

      - name: Lint with Ruff
        run: ruff check . --exclude ".venv" --exclude "tests/"

      - name: Format with Black (check only)
        run: black --check . --extend-exclude ".venv" --extend-exclude "tests/"

      - name: Pylint
        run: pylint src/ scripts/ --rcfile=.pylintrc
# --------------------------------------------------------------
# Continue – إعداد Groq + (اختياري) Ollama
# --------------------------------------------------------------
name: Local Config
version: 1.0.0
schema: v1

models:
  # ==== نموذج Groq (افتراضي) ====
  - name: Llama‑3.1‑8B Instant (Groq)
    provider: groq
    model: llama-3.1-8b-instant          # احرص على أن يكون هذا الاسم موجودًا في القائمة
    apiBase: https://api.groq.com/openai/v1/
    temperature: 0.7
    max_output_tokens: 4096
    description: |
      نموذج Llama‑3.1 بحجم 8 B يدعم العربية.
    tags:
      - groq
      - llama-3.1
      - arabic

  # ==== نموذج Ollama المحلي (اختياري) ====
  - name: Autodetect (Ollama)
    provider: ollama
    model: AUTODETECT
    apiBase: http://127.0.0.1:11434
    temperature: 0.7
    max_output_tokens: 4096
    description: |
      يكتشف تلقائيًا أفضل نموذج من خادم Ollama المحلي.
    tags:
      - local
      - ollama

# --------------------------------------------------------------
# إعدادات عامة
# --------------------------------------------------------------
defaultModel: Llama‑3.1‑8B Instant (Groq)   # أو Autodetect (Ollama) إذا تفضّل المحلي
debug: false
telemetry: true
# ... existing configuration ...


# ============================================================
# ملاحظات تنفيذية للمطورين
# ============================================================
implementation_notes: |
  1. عند تحميل هذا الملف، تحقق من صحة YAML باستخدام مكتبة مثل `pyyaml` أو `ruamel.yaml`.
  2. للحسابات الحرارية، استخدم الثوابت من قسم `defaults` ما لم يُحدد خلاف ذلك في قسم اللقاح.
  3. عامل الأمان (0.85) يُطبق على حدود HER و HEI و MKT للحصول على العتبات التشغيلية.
  4. مرحلة `storage_phases` تُستخدم لتحديد صلاحية اللقاح ديناميكياً حسب ظروف التخزين الفعلية.
  5. حقل `dosing_by_cap_color` ضروري لمنع أخطاء الإعطاء عبر التحقق من لون الغطاء قبل التحضير.
  6. يُوصى بتخزين نسخة مضغوطة (JSON) من هذا الملف للتحميل السريع في التطبيقات الميدانية.
  7. جميع التواريخ بصيغة ISO 8601 (YYYY-MM-DD) للتوافق مع أنظمة السجلات.
services:
  cci-ft2-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data:rw
      - ./data/input_ft2:/app/data/input_ft2:rw
      - ./data/output:/app/data/output:rw
      - ./data/ft2_sessions:/app/data/ft2_sessions:rw
      - ./data/registry:/app/data/registry:rw
      - ./data/reports:/app/data/reports:rw
      - ./logs:/app/logs:rw
      - ~/.cci_ft:/home/cciuser/.cci_ft2:rw
      - ./src:/app/src:ro # 👈 أضف هذا السطر لربط الكود مباشرة
    environment:
      - CCI_ENV=production
      - CCI_DATA_ROOT=/app/data
      - CCI_LOG_LEVEL=INFO
      - DB_HOST=cci-ft2-db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cci_ft2}
      - POSTGRES_USER=${POSTGRES_USER:-cci_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      cci-ft2-db:
        condition: service_healthy
    restart: unless-stopped
    # هذه الطريقة الأقوى في Docker لإبقاء الحاوية مستيقظة للتجربة
    entrypoint: [ "" ]
    command: [ "sleep", "infinity" ]
    healthcheck:
      disable: true

  cci-ft2-db:
    image: postgres:13
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cci_ft2}
      POSTGRES_USER: ${POSTGRES_USER:-cci_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

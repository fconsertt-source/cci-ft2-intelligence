[pytest]
norecursedirs = .git .tox .venv tools
addopts = -ra -q
testpaths = tests
pythonpath = src

# إجبار الاختبارات على وضع headless
env =
    HEADLESS=1

markers =
    performance: marks tests as performance benchmarks
    integration: marks tests as integration tests
    unit: marks tests as unit tests

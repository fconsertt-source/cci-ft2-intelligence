[pytest]
norecursedirs = .git .tox .venv tools
addopts = -ra -q
    --ignore=tests/archive_reportlab_legacy
    -m "not legacy_reportlab"
testpaths = tests
pythonpath = src

# إجبار الاختبارات على وضع headless
env =
    HEADLESS=1

markers =
    performance: marks tests as performance benchmarks
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    weasyprint: اختبارات نظام التقارير الجديد (WeasyPrint)
    gui: اختبارات الواجهة الرسومية (تتطلب tkinter)
    legacy_reportlab: اختبارات ReportLab القديمة (مؤرشفة)
    slow: اختبارات تستغرق وقتاً طويلاً (>5 ثواني)
